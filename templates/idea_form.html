<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Innovation Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">AI-Powered Startup Idea Generator</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" class="bg-white p-4 shadow-sm rounded">
            {% csrf_token %}
            <div class="mb-3">
                <label for="news_text" class="form-label"><strong>Paste a News Article:</strong></label>
                <textarea name="news_text" class="form-control" rows="10" required>{{ news_text }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Generate Idea</button>
        </form>

        {% if idea %}
            <div class="mt-5">
                <h3>🔍 Extracted Keywords:</h3>
                <p>
                    {% for keyword in keywords %}
                        <span class="badge bg-secondary">{{ keyword }}</span>
                    {% endfor %}
                </p>

                <h3 class="mt-4">🚀 Generated Innovation Idea:</h3>
                <div class="border p-3 bg-white rounded shadow-sm">
                    <p>{{ idea }}</p>
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
