{% extends 'base.html' %} {% block title %}Start Project{% endblock %} {% block content %}
<div style="max-width: 500px; margin: 0 auto; text-align: center">
  <h2 style="color: #88c0d0">Start Project</h2>
  <p>Initiate a new project based on your ideas.</p>
  <form method="post">
    {% csrf_token %}
    <input
      type="text"
      name="project_name"
      placeholder="Project name..."
      style="
        width: 100%;
        padding: 0.7rem;
        background: #23262f;
        border: none;
        color: #e8eaed;
        border-radius: 8px;
      "
    />
    <button
      type="submit"
      style="
        margin-top: 1rem;
        background: #88c0d0;
        color: #181a20;
        border: none;
        padding: 0.7rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
      "
    >
      Start
    </button>
  </form>
  {% if project_name %}
  <div style="margin-top: 2rem; color: #88c0d0">
    Started Project: <span style="color: #e8eaed">{{ project_name }}</span>
  </div>
  {% endif %}
</div>
{% endblock %}
